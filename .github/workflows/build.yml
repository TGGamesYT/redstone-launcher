name: Build Electron App

on:
  push:
    branches: [ main ]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # ── Is there anything to release? ─────────────────────────────────────────
  #
  # This runs first and on its own, and everything else waits on it, because
  # the answer "no" has to cost ten seconds rather than three platforms'
  # worth of build.
  #
  # What was here before only looked at this AFTER building everything, and
  # it did not work even then:
  #
  #     TAG=$BASE
  #     while gh release view "$TAG" >/dev/null 2>&1; do
  #       TAG="${BASE}($i)"; i=$((i+1))
  #     done
  #
  # That step had no token on it, so `gh` could not authenticate, so it
  # exited non-zero, so the loop body never ran once and TAG was always the
  # bare version. action-gh-release then uploaded onto the release that was
  # already there -- which REPLACES its files. So every commit to main
  # rebuilt all three platforms and overwrote the released binaries with
  # them, under the same version number.
  #
  # And had the loop worked it would have been wrong anyway: it would have
  # published 1.18.0(1), 1.18.0(2), 1.18.0(3) ... one release per commit.
  # There is no reason to release the same version twice under any name.
  check:
    name: Has this version been released already?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.ask.outputs.build }}
      tag: ${{ steps.ask.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ask GitHub about this version
        id: ask
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail

          # Publishing a release by hand IS the instruction to build it: the
          # release exists because somebody made it, and its artifacts are
          # what this run is for. So that path never asks.
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release ${{ github.event.release.tag_name }} was published by hand — building its artifacts."
            exit 0
          fi

          # Otherwise: scripts/released.mjs, which answers yes or no and
          # fails on anything that is not an answer. See the comment at the
          # top of it for what used to happen here instead.
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$(node scripts/released.mjs "$VERSION")" = "yes" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build-win:
    name: Build Windows
    runs-on: windows-latest
    needs: check
    if: needs.check.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # The build scripts have a pre-step that builds the quiclime sidecar for
      # this runner's operating system -- which is how a release ends up with
      # one for every platform without anybody cross-compiling. The runners do
      # ship Rust, but relying on an image's contents is how a build breaks
      # quietly one day.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sidecar/quiclime/target
          key: ${{ runner.os }}-sidecar-${{ hashFiles('sidecar/quiclime/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sidecar-

      - name: Install dependencies
        run: npm i

      - name: Build Windows
        run: npm run buildWin

      - name: Rename output
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path 'dist' -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No .exe found in dist/ — build likely failed."
            exit 1
          }
          $dest = Join-Path $exe.DirectoryName 'Redstone-Launcher.exe'
          Write-Host "Renaming '$($exe.Name)' -> '$dest'"
          Move-Item -Path $exe.FullName -Destination $dest -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: redstone-launcher-win
          path: dist/*.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sidecar/quiclime/target
          key: ${{ runner.os }}-sidecar-${{ hashFiles('sidecar/quiclime/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sidecar-

      - name: Install dependencies
        run: npm i

      - name: Build Linux
        run: npm run buildLinux

      - name: Rename output
        run: |
          mv dist/*.AppImage dist/Redstone-Launcher.AppImage || true
          mv dist/redstone-launcher_*.deb dist/Redstone-Launcher.deb || true

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: redstone-launcher-linux
          path: |
            dist/*.AppImage
            dist/*.deb

  build-mac:
    name: Build macOS
    runs-on: macos-latest
    needs: check
    if: needs.check.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sidecar/quiclime/target
          key: ${{ runner.os }}-sidecar-${{ hashFiles('sidecar/quiclime/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-sidecar-

      - name: Install dependencies
        run: npm i

      - name: Build macOS
        run: npm run buildMac

      - name: Rename output
        run: |
          mv dist/*.dmg dist/Redstone-Launcher.dmg || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: redstone-launcher-mac
          path: dist/*.dmg

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check, build-win, build-linux, build-mac]
    if: needs.check.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: redstone-launcher-win
          path: ./release-artifacts/

      - name: Download Linux executable
        uses: actions/download-artifact@v4
        with:
          name: redstone-launcher-linux
          path: ./release-artifacts/

      - name: Download macOS executable
        uses: actions/download-artifact@v4
        with:
          name: redstone-launcher-mac
          path: ./release-artifacts/

      # One step, not two. It used to create the release and then upload to
      # it separately, which is two chances to land on something that is
      # already there. Which release this is was settled by the check job
      # before anything was built.
      - name: Release ${{ needs.check.outputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: ${{ needs.check.outputs.tag }}
          files: ./release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}

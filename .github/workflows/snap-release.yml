name: Auto-Snap Release
on:
  push:
    branches: [ main ]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  # The same gate the GitHub release has, for the same reason: this pushed a
  # new revision to the STABLE channel on every commit to main, all of them
  # carrying whatever version number snapcraft.yaml happened to say.
  check:
    name: Has this version been released already?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.ask.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: ask
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(node scripts/released.mjs)" = "yes" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4

      # snapcraft builds in its own clean container, so nothing this runner
      # has reaches it. What the build needs is asked for in snapcraft.yaml,
      # Rust included -- which is what was missing: every snap release since
      # the sidecar was added died in scripts/build-sidecar.mjs for want of
      # cargo.
      - name: Build and Publish
        uses: snapcore/action-build@v1
        id: build

      - name: Push to Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_TOKEN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Redstone Launcher</title>
  <script src="theme-boot.js"></script>
  <link rel="stylesheet" href="server.css" />
  <link rel="stylesheet" href="material-icons.css">
  <!-- The local fallback icon, before anything renders a list with one. -->
  <script src="defaults.js"></script>
  <script src="console-commands.js"></script>
  <script src="loading.js"></script>
  <script src="modalfx.js"></script>
  <script src="pixelart.js"></script>
  <script src="blockrender.js"></script>
  <script src="modelpicker.js"></script>
  <script src="versionicon.js"></script>
  <script src="uimodal.js"></script>
</head>

<body>
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <div class="loading-text">Redstone Launcher</div>
      <div class="loading-subtext">Loading...</div>
    </div>
  </div>
  <div id="toolbar">
    <div class="toolbar-buttons-left">
      <button id="backBtn">⬅</button>
      <button id="forwardBtn">➡</button>
    </div>
    <div class="drag-region">Redstone Launcher</div>
    <div class="toolbar-buttons">
      <div id="instance-processes"></div>
      <button id="min-btn">—</button>
      <button id="max-btn">◻</button>
      <button id="close-btn">✕</button>
    </div>
  </div>
  <div class="sidebar">
    <ul class="menu top">
      <a href="index.html">
        <li><i class="material-icons">home</i><span>Home</span></li>
      </a>
      <a href="instances.html">
        <li><i class="material-icons">play_arrow</i><span>Instances</span></li>
      </a>
      <a href="modrinth.html" class="modrinth">
        <li><span>Modrinth</span></li>
      </a>
      <a href="server.html">
        <li><i class="material-icons">storage</i><span>Server Manager</span></li>
      </a>
    </ul>
    <ul class="menu middle" id="instances">
      <li><i class="material-icons">add</i><span>Add an instance</span></li>
    </ul>
    <ul class="menu bottom">
      <li id="update"><i class="material-icons">download</i><span id="updateText">Download the latest update</span></li>
      <li><a href="profile-manager.html"><i class="material-icons">face</i></a><span>Skins</span></li>
      <a href="players.html">
        <li id="players-login"><i class="material-icons">login</i><span>Login</span></li>
      </a>
      <li><a href="settings.html"><i class="material-icons">settings</i></a><span>Settings</span></li>
      
    </ul>
  </div>
  
  <div id="content">
    <div id="main">
      <h1 id="random-message">Welcome back!</h1>
      <!-- Whatever the layout says. The page used to be a fixed "Continue
           Playing" list and two hard-coded Modrinth rows; it is now drawn
           from the saved layout, and the Edit page button bottom-left is how
           that layout is changed. See home.js. -->
      <div class="main-scrolly" data-fit-height>
        <div id="home-segments"></div>
      </div>
    </div>

    

  <script>
    const { ipcRenderer, shell } = require('electron');
    let selectedPlayerId = null;

    // The overlay used to wait for window.load, which waits for EVERY subresource
    // -- including remote icons from the mod-site CDNs. On a cold boot, with DNS
    // and TLS still warming up, that held the page behind a spinner for seconds
    // after it was perfectly usable, and then waited a further second on top.
    // DOMContentLoaded is the point at which the page can actually be used; a
    // timer caps it either way so a stalled script can't leave it up forever.
    (function () {
      let hidden = false;
      const hideOverlay = () => {
        if (hidden) return;
        hidden = true;
        const overlay = document.getElementById('loading-overlay');
        if (!overlay) return;
        overlay.classList.add('fade-out');
        setTimeout(() => overlay.style.display = 'none', 500);
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', hideOverlay);
      else hideOverlay();
      setTimeout(hideOverlay, 3000);   // hard cap
    })();

    function renderAccountsSidebar() {
      const container = document.getElementById('accounts-container');
      if (!container) return; // Element doesn't exist on this page
      
      container.innerHTML = '';
      
      ipcRenderer.invoke('get-players').then(players => {
        if (!players || players.length === 0) {
          container.innerHTML = '<p style="opacity: 0.6; font-size: 12px;">No accounts added</p>';
          return;
        }
        
        players.forEach(player => {
          const item = document.createElement('div');
          item.className = 'account-item';
          item.innerHTML = `
            <img alt="${player.name}">
            <div class="account-item-info">
              <div class="account-name">${player.name}</div>
              <div class="account-type">${player.type === 'microsoft' ? 'Microsoft' : 'Offline'}</div>
            </div>
            <button class="remove-btn" title="Remove account">✕</button>
          `;
          // Built from the player's real skin. The old src pointed an avatar
          // service at `player.id`, which is this launcher's own account id and
          // not a Minecraft name or uuid at all — so every row here was a
          // stranger's face, or a Steve, by chance.
          if (window.setPlayerHead) {
            window.setPlayerHead(item.querySelector('img'), {
              uuid: player.auth?.uuid || player.uuid,
              name: player.auth?.name || player.name || player.username,
              size: 32,
              offline: player.type !== 'microsoft',
              playerId: player.type !== 'microsoft' ? player.id : null,
            });
          }

          item.querySelector('.remove-btn').onclick = async (e) => {
            e.stopPropagation();
            if (await uiConfirm(`Remove ${player.name} from this launcher?`, { title: 'Remove account', ok: 'Remove', danger: true })) {
              ipcRenderer.send('remove-player', player.id);
              renderAccountsSidebar();
            }
          };
          
          item.onclick = () => {
            selectedPlayerId = player.id;
            document.querySelectorAll('.account-item').forEach(el => {
              el.style.borderColor = el === item ? 'var(--accent)' : 'var(--border-dark)';
            });
          };
          
          container.appendChild(item);
        });
      });
    }

    

    renderAccountsSidebar();
    ipcRenderer.on('players-updated', () => {
      renderAccountsSidebar();
    });
    ipcRenderer.send('get-profiles-latest');
    ipcRenderer.on('profiles-list', (e, profiles) => {
      doshit(profiles)
    });
    ipcRenderer.on('profiles-updates', (e, profiles) => {
      doshit(profiles)
    });

    // The profile list arrives on its own; the recent-instances segment is
    // what draws it now, so this hands it over rather than building a list.
    function doshit(profiles) {
      if (window.Home) window.Home.setProfiles(profiles);
    }
    // ------------------ DISCORD PRESENCE ------------------
    function updatePresence(details, state = "Idle") {
      ipcRenderer.send('update-discord-presence', { details, state });
    }
    updatePresence("In Launcher")
  </script>
  <script src="fitheight.js"></script>
  <script src="playerhead.js"></script>
  <!-- The player segment's render, same bundle as the accounts page. -->
  <script src="skinview3d.bundle.js"></script>
  <script src="home.js"></script>
  <script>
    if (window.Home) window.Home.mount();
  </script>
  <script src="sidebar.js"></script>
  <script src="onboarding.js"></script>
  <script>
    // First ever launch: the tour, then the import modal.
    if (window.Onboarding) window.Onboarding.maybeRunFirstTime();
  </script>
  <script src="notifications.js"></script>
  <script>
    const greetings = [
      "Hello there!",
      "Greetings, human.",
      "Back for more? Are ya ready?",
      "Systems online.",
      "Ready for action?",
      "What's on the menu today?",
      "Did you bring snacks?",
      "Let's get rolling!",
      "Welcome back, commander!",
      "The redstone awaits your command!",
    ];

    const randomGreeting = greetings[Math.floor(Math.random() * greetings.length)];
    document.getElementById("random-message").textContent = randomGreeting;
  </script>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Starting Minecraft</title>
  <link rel="stylesheet" href="common.css">
  <!-- server.css is where the Pixel font and the --menu-bg / --border-dark
       derivations live; the page rules in it match nothing here. -->
  <link rel="stylesheet" href="server.css">
  <style>
    /* A frameless, transparent window: the card below is the whole UI. Shown when
       an instance is launched from a desktop shortcut, where there is otherwise
       no launcher window and nothing at all happens on screen for minutes. */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    #card {
      -webkit-app-region: drag;
      margin: 8px;
      padding: 16px 18px;
      border-radius: var(--border-radius);
      background: linear-gradient(135deg, var(--third-color), color-mix(in srgb, var(--third-color) 78%, black));
      border: 2px solid var(--border-dark);
      box-shadow: 0 14px 40px rgba(0, 0, 0, 0.6);
      color: var(--text-color);
      font-family: var(--text-font);
    }

    #head { display: flex; align-items: center; gap: 12px; }
    #icon { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; flex: 0 0 42px; background: var(--menu-bg); image-rendering: pixelated; }
    #name { font-size: 16px; font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #version { font-size: 12px; opacity: 0.7; }

    #bar {
      position: relative;
      height: 8px;
      margin-top: 14px;
      border-radius: 5px;
      background: var(--menu-bg);
      overflow: hidden;
    }

    #fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0;
      border-radius: 5px;
      background: var(--base-color);
      transition: width 0.2s;
    }

    /* Before any real progress arrives there is nothing to measure, so the bar
       sweeps instead of sitting at zero looking stuck. */
    #bar.indeterminate #fill {
      width: 35%;
      animation: sweep 1.1s ease-in-out infinite;
    }

    @keyframes sweep {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(320%); }
    }

    #status {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
      font-size: 12px;
      opacity: 0.85;
    }

    #label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #pct { flex: 0 0 auto; opacity: 0.7; }
    #card.failed #fill { background: var(--red, #c0392b); }
  </style>
</head>

<body>
  <div id="card">
    <div id="head">
      <img id="icon" src="icon.png" alt="">
      <div style="min-width:0;">
        <div id="name">Starting Minecraft</div>
        <div id="version"></div>
      </div>
    </div>
    <div id="bar" class="indeterminate"><div id="fill"></div></div>
    <div id="status"><span id="label">Preparing…</span><span id="pct"></span></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const bar = document.getElementById('bar');
    const fill = document.getElementById('fill');

    // sidebar.js can't be loaded here — this window has no sidebar or toolbar for
    // it to wire up — so the handful of theme variables the card uses are applied
    // from the settings main.js hands over with splash-init.
    function applyTheme(s) {
      s = s || {};
      const set = (k, v) => { if (v != null) document.documentElement.style.setProperty(k, v); };
      set('--base-color', s.baseColor);
      set('--secondary-color', s.secondaryColor);
      set('--third-color', s.thirdColor);
      set('--text-color', s.textColor);
      set('--text-font', s.font);
      if (s.borderRadius != null) set('--border-radius', s.borderRadius + 'px');
    }

    ipcRenderer.on('splash-init', (e, info) => {
      document.getElementById('name').textContent = info.name || 'Starting Minecraft';
      document.getElementById('version').textContent = info.version || '';
      if (info.icon) document.getElementById('icon').src = info.icon;
      try { applyTheme(info.theme); } catch { /* the stylesheet defaults still apply */ }
    });

    ipcRenderer.on('launch-progress', (e, p) => {
      if (p.label) document.getElementById('label').textContent = p.label;
      if (p.done) {
        bar.classList.remove('indeterminate');
        fill.style.width = '100%';
        document.getElementById('pct').textContent = '';
        return;
      }
      // Only switch off the sweep once there's a real ratio to show.
      if (p.total > 0 && p.current >= 0) {
        const r = Math.max(0, Math.min(1, p.current / p.total));
        bar.classList.remove('indeterminate');
        fill.style.width = (r * 100).toFixed(1) + '%';
        document.getElementById('pct').textContent = Math.round(r * 100) + '%';
      }
    });

    ipcRenderer.on('splash-error', (e, msg) => {
      document.getElementById('card').classList.add('failed');
      bar.classList.remove('indeterminate');
      fill.style.width = '100%';
      document.getElementById('label').textContent = msg || 'Launch failed';
      document.getElementById('pct').textContent = '';
    });
  </script>
</body>

</html>
